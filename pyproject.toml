[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-ai"
version = "0.1.0"
description = "A local-first, approval-based Linux AI operator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "rich>=13.7,<15",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
hive = "hive.cli.app:main"

[tool.setuptools.packages.find]
include = ["hive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
